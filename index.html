<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PushT — Rapier2D demo</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1f242b;
        --text: #e6e9ed;
        --muted: #8b94a0;
        --accent: #4a90e2;
        --good: #35c46a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        padding: 10px 14px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 12px; }
      #board {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
        touch-action: none;
      }
      footer {
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        background: var(--panel);
      }
      #status { flex: 1 1 180px; font-size: 14px; }
      #status.good { color: var(--good); font-weight: 600; }
      #status.bad { color: #e2674a; }
      .stat { color: var(--muted); font-size: 12px; }
      .stat b { color: var(--text); font-size: 14px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
      }
      button.secondary { background: #3a414b; }
      button:disabled { opacity: 0.4; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>PushT</h1>
      <span class="sub">Rapier2D physics · drag the robot to push the T onto the target</span>
    </header>
    <div id="board"></div>
    <footer>
      <div id="status">Touch the robot to start</div>
      <div class="stat">solved&nbsp;<b id="count">0</b></div>
      <div class="stat" id="coverage">coverage 0%</div>
      <button id="save" class="secondary" disabled>Save episode</button>
      <button id="restart">Restart</button>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
